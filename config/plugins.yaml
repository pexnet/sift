version: 1
plugins:
  - id: noop
    enabled: true
    backend:
      class_path: sift.plugins.builtin.noop:NoopPlugin
    capabilities:
      - ingest_hook
    settings: {}
  - id: keyword_heuristic_classifier
    enabled: true
    backend:
      class_path: sift.plugins.builtin.keyword_heuristic_classifier:KeywordHeuristicClassifierPlugin
    capabilities:
      - stream_classifier
    settings: {}
  - id: search_provider
    enabled: true
    backend:
      class_path: sift.plugins.builtin.search_provider_runtime:SearchProviderRuntimePlugin
    capabilities:
      - search_provider
    settings:
      search_provider:
        provider_chain:
          - searxng
          - brave_search
        provider_budgets:
          searxng:
            max_requests_per_run: 10
            max_requests_per_day: 100
            min_interval_ms: 250
            max_query_variants_per_stream: 5
            max_results_per_query: 25
          brave_search:
            max_requests_per_run: 5
            max_requests_per_day: 25
            min_interval_ms: 400
            max_query_variants_per_stream: 4
            max_results_per_query: 10
        providers:
          searxng:
            # Self-hosted SearXNG via dev-container Docker Compose.
            # The searxng service is defined in .devcontainer/docker-compose.yml
            # with JSON format enabled in .devcontainer/searxng/settings.yml.
            # Public instances rate-limit JSON API; self-hosting is required.
            # See: docs/specs/done/searxng-verification-2026-07-03.md
            # For standalone local Docker (outside compose): http://localhost:8080/search
            base_url: http://searxng:8080/search
          brave_search:
            endpoint: https://api.search.brave.com/res/v1/web/search
            api_key: ${SIFT_BRAVE_SEARCH_API_KEY}
  - id: discover_feeds
    enabled: true
    backend:
      class_path: sift.plugins.builtin.noop:NoopPlugin
    capabilities:
      - discover_feeds
      - workspace_area
    ui:
      area:
        title: Discover feeds
        icon: search
        order: 10
        route_key: discover-feeds
    settings:
      discover_feeds:
        provider_chain:
          - searxng
        provider_budgets:
          searxng:
            max_requests_per_run: 10
            max_requests_per_day: 100
            min_interval_ms: 250
            max_query_variants_per_stream: 5
            max_results_per_query: 25
