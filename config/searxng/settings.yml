# SearXNG settings for Sift
# Enables JSON API format required by the Sift search-provider adapter.

use_default_settings: true

general:
  instance_name: "Sift SearXNG"
  debug: false

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

server:
  secret_key: "sift-searxng-secret-key-change-in-prod"
  limiter: false
  image_proxy: false

engines:
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: google
    engine: google
    disabled: false
  - name: bing
    engine: bing
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false