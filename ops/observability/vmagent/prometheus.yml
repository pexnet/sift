global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: sift-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          sift_component: api

  - job_name: sift-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9101"]
        labels:
          sift_component: scheduler

  - job_name: sift-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9102"]
        labels:
          sift_component: worker

  - job_name: vmagent
    metrics_path: /metrics
    static_configs:
      - targets: ["vmagent:8429"]

  - job_name: victoriametrics
    metrics_path: /metrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: victorialogs
    metrics_path: /metrics
    static_configs:
      - targets: ["victorialogs:9428"]
